[package]
name = "mtool-system"
version.workspace = true
authors.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mapp = { path = "../../crates/mapp" }
# msysev = { path = "../../crates/msysev", features = ["event-loop"] } # for event module
# mkeybinding = { path = "../../crates/mkeybinding" } # for keybinding module
mtool-core = { path = "../mtool-core" }
mtool-dioxus = { path = "../mtool-dioxus" }
mtool-p2p = { path = "../mtool-p2p" }

# [target.'cfg(target_os = "linux")'.dependencies]
# zbus = { version = "4", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-future = { version = "0.2", features = [ "std" ] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
]
