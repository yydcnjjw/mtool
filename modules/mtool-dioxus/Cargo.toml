[package]
name = "mtool-dioxus"
version.workspace = true
authors.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
bevy = [ "dep:bevy" ]
bevy_dynamic_linking = [ "bevy?/dynamic_linking" ]

[dependencies]
mapp = { path = "../../crates/mapp", features = ["web"] }
mkeybinding = { path = "../../crates/mkeybinding" }

mtool-core = { path = "../mtool-core" }
mtool-storage = { path = "../mtool-storage" }

dioxus = { workspace = true, features = ["router"] }
dioxus-free-icons = { version = "0.10.0-alpha.1", features = ["octicons"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components" }
blake3 = { version = "1.5", features = ["pure"] } # use pure for fix compile error
route-recognizer = "*"
infer = "*"
urlencoding = "*"

bevy = { workspace = true, optional = true }

[dependencies.dioxus-desktop]
workspace = true
