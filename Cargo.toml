[workspace]

resolver = "2"

members = [
  "crates/mapp",
  "crates/mcloud-api",
  "crates/mdict",
  "crates/minject",
  "crates/msysev",
  "crates/mkeybinding",
  # "crates/mtauri-sys",
  "crates/manki-api",
  "crates/mproxy",
  # "crates/mllama-sys",

  "modules/mtool-core",
  "modules/mtool-system",
  "modules/mtool-rpc",
  "modules/mtool-storage",
  "modules/mtool-dioxus",
  "modules/mtool-cmdpal",
  "modules/mtool-apps",
  "modules/mtool-assistant",
  "modules/mtool-proxy",  
  # "modules/mtool-pdf",
  # "modules/mtool-wgui",
  # "modules/mtool-cmder",
  # "modules/mtool-main-window",
  # "modules/mtool-interactive",
  # "modules/mtool-dict",
  # "modules/mtool-translate",
  
  # "modules/mtool-wgui/wmain",
  # "modules/mtool-proxy",
  # "modules/mtool-toast",
  # "modules/mtool-ai",
  "mtool",
]

[workspace.package]
version = "0.0.0"
authors = ["yydcnjjw <yydcnjjw@gmail.com>"]
edition = "2021"

[workspace.dependencies]
# TODO: macro re-export support
dioxus = { version = "0.7.0-alpha.3" }
dioxus-desktop = { version = "0.7.0-alpha.3" }
dioxus-asset-resolver = { version = "0.7.0-alpha.3" }

bevy = { version = "0.16.1" }
ouroboros = "*"
clap = { version = "*", features = ["derive", "cargo", "string"] }
sea-orm = "*"
sea-orm-migration = "*"
thiserror = "*"

tonic = "*"
tonic-prost = "*"
prost = "*"
tonic-prost-build = "*"

# NOTE: platform custom features
web-sys = "*"
windows = "0.58"


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
